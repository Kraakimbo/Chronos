{% macro token_icon(size=20) %}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" class="inline-block align-middle shrink-0" aria-label="Chronos Token" role="img">
  <circle cx="12" cy="12" r="11" fill="#d4af37" stroke="#1a1c1b" stroke-width="1.4"/>
  {% for i in range(12) %}
  <line x1="12" y1="2.4" x2="12" y2="3.6" transform="rotate({{ i * 30 }} 12 12)" stroke="#1a1c1b" stroke-width="1"/>
  {% endfor %}
  <text x="12" y="16.5" text-anchor="middle" font-family="Georgia, 'Playfair Display', serif" font-weight="700" font-size="12" fill="#1a1c1b">C</text>
</svg>
{% endmacro %}

{% macro avatar(avatar_id, size_class="w-10 h-10", text_size="text-lg") %}
{% set av = avatars.get(avatar_id, avatars["1"]) %}
<div class="{{ size_class }} rounded-full border border-outline-variant flex items-center justify-center shrink-0" style="background-color: {{ av.bg }};">
  <span class="{{ text_size }}" role="img" aria-label="{{ av.label }}">{{ av.emoji }}</span>
</div>
{% endmacro %}
