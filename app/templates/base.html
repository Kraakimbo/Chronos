<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>{% block title %}Chronos{% endblock %}</title>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          "primary": "#735c00",
          "primary-container": "#d4af37",
          "on-primary": "#ffffff",
          "on-primary-container": "#554300",
          "background": "#faf9f7",
          "surface": "#faf9f7",
          "surface-container-lowest": "#ffffff",
          "surface-container-low": "#f4f3f1",
          "on-surface": "#1a1c1b",
          "on-surface-variant": "#4d4635",
          "outline": "#7f7663",
          "outline-variant": "#d0c5af",
          "error": "#ba1a1a",
          "on-error": "#ffffff",
          "error-container": "#ffdad6",
        },
        fontFamily: {
          "headline": ["Playfair Display", "serif"],
          "body": ["Plus Jakarta Sans", "sans-serif"],
        },
        spacing: {
          "xs": "4px",
          "sm": "8px",
          "md": "16px",
          "lg": "24px",
          "xl": "32px",
          "2xl": "48px",
          "margin-mobile": "20px",
        },
      },
    },
  };
</script>
</head>
<body class="bg-background text-on-surface font-body antialiased min-h-screen flex flex-col">
<header class="flex justify-center items-center py-md border-b border-outline-variant/30">
  <span class="font-headline text-2xl text-primary">Chronos</span>
</header>

<main class="flex-1 flex flex-col items-center justify-center px-margin-mobile py-xl w-full">
  <div class="w-full max-w-md">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="mb-lg flex flex-col gap-sm">
          {% for category, message in messages %}
            <div class="rounded-xl px-md py-sm text-sm font-bold
              {% if category == 'error' %}bg-error-container text-error
              {% elif category == 'success' %}bg-primary-container/20 text-on-primary-container
              {% else %}bg-surface-container-low text-on-surface-variant{% endif %}">
              {{ message }}
            </div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </div>
</main>
</body>
</html>
