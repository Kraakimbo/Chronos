{% macro password_input(field, autocomplete, ring="focus:ring-primary-container") %}
<div class="relative">
  {{ field(class_="w-full rounded-xl border border-outline-variant bg-surface-container-lowest px-md py-sm pr-11 focus:ring-2 " ~ ring ~ " focus:outline-none", autocomplete=autocomplete) }}
  <button type="button"
    onclick="var i=document.getElementById('{{ field.id }}'); var toText = i.type==='password'; i.type = toText ? 'text' : 'password'; this.querySelector('.icon-off').classList.toggle('hidden', toText); this.querySelector('.icon-on').classList.toggle('hidden', !toText); this.setAttribute('aria-label', toText ? 'Masquer le mot de passe' : 'Afficher le mot de passe');"
    class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface"
    aria-label="Afficher le mot de passe">
    <span class="material-symbols-outlined text-[20px] icon-off" aria-hidden="true">visibility</span>
    <span class="material-symbols-outlined text-[20px] icon-on hidden" aria-hidden="true">visibility_off</span>
  </button>
</div>
{% endmacro %}
